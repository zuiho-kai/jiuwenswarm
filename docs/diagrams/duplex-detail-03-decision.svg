<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1016px;height:1003px;background:#FFFFFF;" width="1016px" height="1003px" viewBox="0 0 1016 1003" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="403.187" y="34.813" fill="#000" font-size="14" textLength="208.51" font-weight="700" font-family="Microsoft YaHei">③ 快模型判断：展开总览第 ③ 步</text></g><ellipse cx="238.492" cy="64.478" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M401.406,84.478 L401.406,138.271 L381.406,142.271 L401.406,146.271 L401.406,200.063 A0,0 0 0 0 401.406,200.063 L742.406,200.063 A0,0 0 0 0 742.406,200.063 L742.406,94.478 L732.406,84.478 L401.406,84.478 A0,0 0 0 0 401.406,84.478" style="stroke:#181818;stroke-width:0.5;" fill="#F5F6F8"/><path d="M732.406,84.478 L732.406,94.478 L742.406,94.478 L732.406,84.478" style="stroke:#181818;stroke-width:0.5;" fill="#F5F6F8"/><text x="407.406" y="106.407" fill="#000" font-size="16" textLength="304" font-family="Microsoft YaHei">任务、约束、已提交公开输出、工具状态，</text><text x="407.406" y="127.524" fill="#000" font-size="16" textLength="224" font-family="Microsoft YaHei">以及版本、轮次和检查点标识。</text><text x="407.406" y="148.642" fill="#000" font-size="16" textLength="320" font-family="Microsoft YaHei">假设未显式发布时保持未知；不读隐藏思维。</text><text x="407.406" y="169.759" fill="#000" font-size="16" textLength="320" font-family="Microsoft YaHei">摘要绑定发布时的计划与任务；来源改变后，</text><text x="407.406" y="190.876" fill="#000" font-size="16" textLength="240.305" font-family="Microsoft YaHei">旧目标 / 旧动作不能覆盖新计划。</text><rect x="95.578" y="121.712" width="285.828" height="41.117" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="105.578" y="148.642" fill="#000" font-size="16" textLength="265.828" font-family="Microsoft YaHei">③.1 读取慢 Agent 已提交的工作状态</text><rect x="164.492" y="274.427" width="148" height="62.234" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="174.492" y="301.356" fill="#000" font-size="16" textLength="112" font-family="Microsoft YaHei">交回原投递逻辑</text><text x="174.492" y="322.474" fill="#000" font-size="16" textLength="128" font-family="Microsoft YaHei">不凭空做打断决定</text><ellipse cx="238.492" cy="367.661" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="238.492" cy="367.661" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="166.492,221.868,310.492,221.868,322.492,233.868,310.492,245.868,166.492,245.868,154.492,233.868,166.492,221.868" fill="#FFF1CC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="242.492" y="262.798" fill="#000" font-size="16" font-family="Microsoft YaHei">否</text><text x="166.492" y="240.239" fill="#000" font-size="16" textLength="144" font-family="Microsoft YaHei">有可用的工作快照？</text><text x="322.492" y="229.681" fill="#000" font-size="16" font-family="Microsoft YaHei">是</text><rect x="123.066" y="420.661" width="230.852" height="62.234" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="133.066" y="447.591" fill="#000" font-size="16" textLength="161.969" font-family="Microsoft YaHei">③.2 计算剩余判断时间</text><text x="133.066" y="468.708" fill="#000" font-size="16" textLength="210.852" font-family="Microsoft YaHei">默认从最早消息到达起共 2 秒</text><polygon points="182.492,504.7,294.492,504.7,306.492,516.7,294.492,528.7,182.492,528.7,170.492,516.7,182.492,504.7" fill="#FFF1CC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="182.492" y="523.071" fill="#000" font-size="16" textLength="112" font-family="Microsoft YaHei">还有剩余时间？</text><text x="154.492" y="512.513" fill="#000" font-size="16" font-family="Microsoft YaHei">否</text><text x="306.492" y="512.513" fill="#000" font-size="16" font-family="Microsoft YaHei">是</text><rect x="16" y="538.7" width="132" height="41.117" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="565.63" fill="#000" font-size="16" textLength="112" font-family="Microsoft YaHei">降级为“追加”</text><path d="M545.137,543.7 L545.137,565.817 L525.137,569.817 L545.137,573.817 L545.137,595.935 A0,0 0 0 0 545.137,595.935 L852.34,595.935 A0,0 0 0 0 852.34,595.935 L852.34,553.7 L842.34,543.7 L545.137,543.7 A0,0 0 0 0 545.137,543.7" style="stroke:#181818;stroke-width:0.5;" fill="#F5F6F8"/><path d="M842.34,543.7 L842.34,553.7 L852.34,553.7 L842.34,543.7" style="stroke:#181818;stroke-width:0.5;" fill="#F5F6F8"/><text x="551.137" y="565.63" fill="#000" font-size="16" textLength="272" font-family="Microsoft YaHei">判断期间新消息到达：取消本次判断，</text><text x="551.137" y="586.747" fill="#000" font-size="16" textLength="286.203" font-family="Microsoft YaHei">回到 ② 合批，再进入 ③；预算不重置。</text><rect x="264.832" y="538.7" width="260.305" height="62.234" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="274.832" y="565.63" fill="#000" font-size="16" textLength="209.969" font-family="Microsoft YaHei">③.3 快模型看消息与工作状态</text><text x="274.832" y="586.747" fill="#000" font-size="16" textLength="240.305" font-family="Microsoft YaHei">只返回“追加 / 打断”和对应版本</text><polygon points="290,622.739,499.969,622.739,511.969,634.739,499.969,646.739,290,646.739,278,634.739,290,622.739" fill="#FFF1CC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="290" y="641.11" fill="#000" font-size="16" textLength="209.969" font-family="Microsoft YaHei">③.4 返回及时，且结果合法？</text><text x="262" y="630.552" fill="#000" font-size="16" font-family="Microsoft YaHei">否</text><text x="511.969" y="630.552" fill="#000" font-size="16" font-family="Microsoft YaHei">是</text><rect x="178" y="656.739" width="180" height="62.234" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="188" y="683.669" fill="#000" font-size="16" textLength="160" font-family="Microsoft YaHei">超时、异常或非法结果</text><text x="188" y="704.786" fill="#000" font-size="16" textLength="112" font-family="Microsoft YaHei">降级为“追加”</text><path d="M664.953,656.739 L664.953,689.415 L644.953,693.415 L664.953,697.415 L664.953,730.091 A0,0 0 0 0 664.953,730.091 L995.883,730.091 A0,0 0 0 0 995.883,730.091 L995.883,666.739 L985.883,656.739 L664.953,656.739 A0,0 0 0 0 664.953,656.739" style="stroke:#181818;stroke-width:0.5;" fill="#F5F6F8"/><path d="M985.883,656.739 L985.883,666.739 L995.883,666.739 L985.883,656.739" style="stroke:#181818;stroke-width:0.5;" fill="#F5F6F8"/><text x="670.953" y="678.669" fill="#000" font-size="16" textLength="309.93" font-family="Microsoft YaHei">状态变化时，单次 observe 最多重算一次。</text><text x="670.953" y="699.786" fill="#000" font-size="16" textLength="288" font-family="Microsoft YaHei">仍无法得到有效决定或预算耗尽：追加。</text><text x="670.953" y="720.903" fill="#000" font-size="16" textLength="260.734" font-family="Microsoft YaHei">执行器应用前还会再次校验，见 ④。</text><rect x="398.984" y="672.856" width="245.969" height="41.117" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="408.984" y="699.786" fill="#000" font-size="16" textLength="225.969" font-family="Microsoft YaHei">③.5 对照当前工作状态校验版本</text><polygon points="394.984,736.091,406.984,748.091,394.984,760.091,382.984,748.091,394.984,736.091" fill="#FFF1CC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="238.492,766.091,250.492,778.091,238.492,790.091,226.492,778.091,238.492,766.091" fill="#FFF1CC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="78.773" y="810.091" width="319.438" height="41.117" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="88.773" y="837.021" fill="#000" font-size="16" textLength="299.438" font-family="Microsoft YaHei">③.6 将决定、版本和完整消息交给第 ④ 步</text><ellipse cx="238.492" cy="882.208" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="238.492" cy="882.208" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="238.492" y1="74.478" x2="238.492" y2="121.712" style="stroke:#181818;stroke-width:1;"/><polygon points="234.492,111.712,238.492,121.712,242.492,111.712,238.492,115.712" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="238.492" y1="336.661" x2="238.492" y2="356.661" style="stroke:#181818;stroke-width:1;"/><polygon points="234.492,346.661,238.492,356.661,242.492,346.661,238.492,350.661" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="238.492" y1="245.868" x2="238.492" y2="274.427" style="stroke:#181818;stroke-width:1;"/><polygon points="234.492,264.427,238.492,274.427,242.492,264.427,238.492,268.427" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="322.492" y1="233.868" x2="334.492" y2="233.868" style="stroke:#181818;stroke-width:1;"/><polygon points="330.492,321.044,334.492,331.044,338.492,321.044,334.492,325.044" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="334.492" y1="233.868" x2="334.492" y2="400.661" style="stroke:#181818;stroke-width:1;"/><line x1="334.492" y1="400.661" x2="238.492" y2="400.661" style="stroke:#181818;stroke-width:1;"/><line x1="238.492" y1="400.661" x2="238.492" y2="420.661" style="stroke:#181818;stroke-width:1;"/><polygon points="234.492,410.661,238.492,420.661,242.492,410.661,238.492,414.661" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="238.492" y1="162.829" x2="238.492" y2="221.868" style="stroke:#181818;stroke-width:1;"/><polygon points="234.492,211.868,238.492,221.868,242.492,211.868,238.492,215.868" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="278" y1="634.739" x2="268" y2="634.739" style="stroke:#181818;stroke-width:1;"/><line x1="268" y1="634.739" x2="268" y2="656.739" style="stroke:#181818;stroke-width:1;"/><polygon points="264,646.739,268,656.739,272,646.739,268,650.739" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="511.969" y1="634.739" x2="521.969" y2="634.739" style="stroke:#181818;stroke-width:1;"/><line x1="521.969" y1="634.739" x2="521.969" y2="672.856" style="stroke:#181818;stroke-width:1;"/><polygon points="517.969,662.856,521.969,672.856,525.969,662.856,521.969,666.856" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="268" y1="718.974" x2="268" y2="748.091" style="stroke:#181818;stroke-width:1;"/><line x1="268" y1="748.091" x2="382.984" y2="748.091" style="stroke:#181818;stroke-width:1;"/><polygon points="372.984,744.091,382.984,748.091,372.984,752.091,376.984,748.091" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="521.969" y1="713.974" x2="521.969" y2="748.091" style="stroke:#181818;stroke-width:1;"/><line x1="521.969" y1="748.091" x2="406.984" y2="748.091" style="stroke:#181818;stroke-width:1;"/><polygon points="416.984,744.091,406.984,748.091,416.984,752.091,412.984,748.091" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="394.984" y1="600.935" x2="394.984" y2="622.739" style="stroke:#181818;stroke-width:1;"/><polygon points="390.984,612.739,394.984,622.739,398.984,612.739,394.984,616.739" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="170.492" y1="516.7" x2="82" y2="516.7" style="stroke:#181818;stroke-width:1;"/><line x1="82" y1="516.7" x2="82" y2="538.7" style="stroke:#181818;stroke-width: