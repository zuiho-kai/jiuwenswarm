="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="44"><rect x="283.387" y="914.208" width="448.108" height="65.433" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="288.387" y="934.021" fill="#000" font-size="14" textLength="341.018" font-weight="700" font-family="Microsoft YaHei">本图输出：一个决定。快模型自己不会暂停慢 Agent。</text><text x="288.387" y="952.499" fill="#000" font-size="14" textLength="406" font-family="Microsoft YaHei">给快模型的消息有长度限制并标记截断；真正投递保留完整原文。</text><text x="288.387" y="970.977" fill="#000" font-size="14" textLength="438.108" font-family="Microsoft YaHei">对应代码：duplex_router.py / duplex_state.py / duplex_shadow.py</text></g><?plantuml-src RLLBKzjM5DxxLzoPRWABjAHDfXDMBQsdctRJLMUOwJXOW2P6OcoHDbt916FPiR41lnyO0yRWWcqQQepbntyXEbVIYh-GStM9SGQqqjnxNjztldEk8Ye-WTni7n0O_KjFgh3t7hGZcZc_xHVW8WrzbQgwLTVCipF7YfxNN87NehJgyNjMY5TOzApv5BSiARzvLWJogxZWbmFoeaB-yFmYY8zR_Yx-8v2P5nENWMMFL_vBb9R8eiSN42PkF0kA-4PKtlxeMNYzv9VN9E-Sx9FzvAkVPzpVkDsFMFuaUbPaoVl0mUrspypDJJX8iY8yj7hkVk7-tXLGF7x5zH81FvqXLak7H8Q63iWFIuAa4BZwZoQIHk_8B6p0LSqObCneXwh1MHSBIVpYqhBY8iJGTOXMFwf1itTConNy6Jj2w0o9jOQx4EuvvpK8NV4Wj_sOurk3HDICQBHqXWRMe4dFgh0JeuSghTJCzMkw7xPQcn_LTJI6ODXg3ccfGND3w2SWiGtTTpJRCKPb6WlYkLcftVQBHZUEIEn2qiecg5eszKlkJhTprd7GrBUXMHZx8ZIhMGLjn-XkSI0OWPPhj9UagMj8v22vnKkbsRfPR68zv6ls3z4J98JbUZUmZZVDOePcsZmKIoT8NeTubxX8dj1I118jCtKo9X8rQ8Rgj_tA556M1OayWUJn52PvoKWhxi5MXKRJjhfZeoQ7s_CIve7mkNdQWs21HdPHjh3v0N7Ceaz0aLTT0ie94-LQKoorkCXx-enWHMOp2v5JOv3dUaVGTlPoNhBrdDKyClGjMb9fzfHsD1fiWTQsXaFh_oi8NP1dnAplp3e8h56EWN32y02Fr6xdusQlRdHxDsh96WqWkd-ZbcSdIqCZLjQtzpDebjxppCZ_fCRc9KWqh54AoHX7OyGxs34iQWHQrz1BSUqm7huG9Qg5eorLi5XipIG-Dl8ez0xpP7gxsmCnxeVqQstS0LK2IOr6hl42DkFMg0YX6biDA13xO0DPnQROuRWvQ79zZLjE2AEC0VsES0YeSMGD0ndTbAdlqhqI2_qX_P14PCZgXD2OZKj_7RfTgcNiyXuQSqTitECqOm6JHDzH_PmWJIWr6En293x9CDslsetOFNqF22I46x8XY6Lu_H1F8s54VXKG_6y4WjA1em8ZWR6XuXMdWds67gVPVQmRXbaa5EL3qnfNBOFaC6YfMMWFi1qSnxqpZTIjQWpo9wp3gHCi7HLeODisuvY4buxbMFKWTkJmizz41