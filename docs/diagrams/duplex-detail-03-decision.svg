<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:670px;height:823px;background:#FFFFFF;" width="670px" height="823px" viewBox="0 0 670 823" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="229.761" y="34.813" fill="#000" font-size="14" textLength="208.51" font-weight="700" font-family="Microsoft YaHei">③ 快模型判断：展开总览第 ③ 步</text></g><ellipse cx="170.984" cy="64.478" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M345.969,88.919 L345.969,111.036 L325.969,115.036 L345.969,119.036 L345.969,141.153 A0,0 0 0 0 345.969,141.153 L638.969,141.153 A0,0 0 0 0 638.969,141.153 L638.969,98.919 L628.969,88.919 L345.969,88.919 A0,0 0 0 0 345.969,88.919" style="stroke:#181818;stroke-width:0.5;" fill="#F5F6F8"/><path d="M628.969,88.919 L628.969,98.919 L638.969,98.919 L628.969,88.919" style="stroke:#181818;stroke-width:0.5;" fill="#F5F6F8"/><text x="351.969" y="110.849" fill="#000" font-size="16" textLength="272" font-family="Microsoft YaHei">摘要来源改变后失效；不读隐藏思维。</text><text x="351.969" y="131.966" fill="#000" font-size="16" textLength="256" font-family="Microsoft YaHei">原消息和状态不按固定字符数截断。</text><rect x="16" y="94.478" width="309.969" height="41.117" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="121.407" fill="#000" font-size="16" textLength="289.969" font-family="Microsoft YaHei">③.1 读取已提交的计划、约束和工具状态</text><rect x="104.984" y="215.517" width="132" height="41.117" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="114.984" y="242.446" fill="#000" font-size="16" textLength="112" font-family="Microsoft YaHei">交回原投递逻辑</text><ellipse cx="170.984" cy="292.575" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="170.984" cy="292.575" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="122.984,162.958,218.984,162.958,230.984,174.958,218.984,186.958,122.984,186.958,110.984,174.958,122.984,162.958" fill="#FFF1CC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="174.984" y="203.888" fill="#000" font-size="16" font-family="Microsoft YaHei">否</text><text x="122.984" y="181.329" fill="#000" font-size="16" textLength="96" font-family="Microsoft YaHei">有工作快照？</text><text x="230.984" y="170.771" fill="#000" font-size="16" font-family="Microsoft YaHei">是</text><path d="M297.969,335.575 L297.969,368.251 L277.969,372.251 L297.969,376.251 L297.969,408.927 A0,0 0 0 0 297.969,408.927 L649.031,408.927 A0,0 0 0 0 649.031,408.927 L649.031,345.575 L639.031,335.575 L297.969,335.575 A0,0 0 0 0 297.969,335.575" style="stroke:#181818;stroke-width:0.5;" fill="#F5F6F8"/><path d="M639.031,335.575 L639.031,345.575 L649.031,345.575 L639.031,335.575" style="stroke:#181818;stroke-width:0.5;" fill="#F5F6F8"/><text x="303.969" y="357.505" fill="#000" font-size="16" textLength="330.063" font-family="Microsoft YaHei">总期限取 SDK 快模型 timeout，可显式覆盖。</text><text x="303.969" y="378.622" fill="#000" font-size="16" textLength="288" font-family="Microsoft YaHei">从最早消息到达起算；新消息不延长它。</text><text x="303.969" y="399.739" fill="#000" font-size="16" textLength="320" font-family="Microsoft YaHei">真正并发到达的新消息可取消旧判断并合批。</text><rect x="64" y="351.692" width="213.969" height="41.117" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="74" y="378.622" fill="#000" font-size="16" textLength="193.969" font-family="Microsoft YaHei">③.2 快模型判断追加或打断</text><rect x="48.984" y="483.29" width="244" height="62.234" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="58.984" y="510.22" fill="#000" font-size="16" textLength="174.68" font-family="Microsoft YaHei">按原方案交给 SDK steer</text><text x="58.984" y="531.337" fill="#000" font-size="16" textLength="224" font-family="Microsoft YaHei">记录失败状态，不算作成功分类</text><ellipse cx="170.984" cy="576.524" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="170.984" cy="576.524" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="74,430.731,267.969,430.731,279.969,442.731,267.969,454.731,74,454.731,62,442.731,74,430.731" fill="#FFF1CC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="174.984" y="471.661" fill="#000" font-size="16" font-family="Microsoft YaHei">否</text><text x="74" y="449.103" fill="#000" font-size="16" textLength="193.969" font-family="Microsoft YaHei">③.3 判断成功且版本有效？</text><text x="279.969" y="438.544" fill="#000" font-size="16" font-family="Microsoft YaHei">是</text><rect x="19.266" y="629.524" width="303.438" height="41.117" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="29.266" y="656.454" fill="#000" font-size="16" textLength="283.438" font-family="Microsoft YaHei">③.4 决定、版本与完整消息交给第 ④ 步</text><ellipse cx="170.984" cy="701.642" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="170.984" cy="701.642" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="170.984" y1="74.478" x2="170.984" y2="94.478" style="stroke:#181818;stroke-width:1;"/><polygon points="166.984,84.478,170.984,94.478,174.984,84.478,170.984,88.478" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="170.984" y1="256.634" x2="170.984" y2="281.575" style="stroke:#181818;stroke-width:1;"/><polygon points="166.984,271.575,170.984,281.575,174.984,271.575,170.984,275.575" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="170.984" y1="186.958" x2="170.984" y2="215.517" style="stroke:#181818;stroke-width:1;"/><polygon points="166.984,205.517,170.984,215.517,174.984,205.517,170.984