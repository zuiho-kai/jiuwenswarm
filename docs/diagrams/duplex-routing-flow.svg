<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:971px;height:648px;background:#FFFFFF;" width="971px" height="648px" viewBox="0 0 971 648" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="414.765" y="34.813" fill="#000" font-size="14" textLength="140" font-weight="700" font-family="Microsoft YaHei">一条新消息的处理流程</text></g><ellipse cx="297.015" cy="64.478" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="203.825" y="94.478" width="186.381" height="64.874" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="213.825" y="122.465" fill="#000" font-size="17" textLength="166.381" font-family="Microsoft YaHei">① 慢 Agent 正在干活</text><text x="213.825" y="144.902" fill="#000" font-size="17" textLength="153" font-family="Microsoft YaHei">此时收到一条新消息</text><path d="M440.03,173.133 L440.03,196.57 L420.03,200.57 L440.03,204.57 L440.03,228.007 A0,0 0 0 0 440.03,228.007 L665.03,228.007 A0,0 0 0 0 665.03,228.007 L665.03,183.133 L655.03,173.133 L440.03,173.133 A0,0 0 0 0 440.03,173.133" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><path d="M655.03,173.133 L655.03,183.133 L665.03,183.133 L655.03,173.133" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><text x="446.03" y="196.121" fill="#000" font-size="17" textLength="178.351" font-family="Microsoft YaHei">慢 Agent 此时继续工作</text><text x="446.03" y="218.558" fill="#000" font-size="17" textLength="204" font-family="Microsoft YaHei">又来消息就合起来重新判断</text><rect x="174" y="179.352" width="246.03" height="42.437" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="184" y="207.339" fill="#000" font-size="17" textLength="226.03" font-family="Microsoft YaHei">② 接住消息，交给快模型判断</text><polygon points="158.5,251.393,435.53,251.393,447.53,263.393,435.53,275.393,158.5,275.393,146.5,263.393,158.5,251.393" fill="#FFF1CC" style="stroke:#6A8BAB;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="158.5" y="270.163" fill="#000" font-size="17" textLength="277.03" font-family="Microsoft YaHei">③ 新消息需要马上改变当前工作吗？</text><text x="95.5" y="258.944" fill="#000" font-size="17" textLength="51" font-family="Microsoft YaHei">不需要</text><text x="447.53" y="258.944" fill="#000" font-size="17" textLength="34" font-family="Microsoft YaHei">需要</text><rect x="16" y="285.393" width="241" height="64.874" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="313.381" fill="#000" font-size="17" textLength="135.992" font-family="Microsoft YaHei">④A 当前步骤继续</text><text x="26" y="335.818" fill="#000" font-size="17" textLength="221" font-family="Microsoft YaHei">下一次模型调用前加入新消息</text><path d="M606.53,285.393 L606.53,320.049 L586.53,324.049 L606.53,328.049 L606.53,362.704 A0,0 0 0 0 606.53,362.704 L950.53,362.704 A0,0 0 0 0 950.53,362.704 L950.53,295.393 L940.53,285.393 L606.53,285.393 A0,0 0 0 0 606.53,285.393" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><path d="M940.53,285.393 L940.53,295.393 L950.53,295.393 L940.53,285.393" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><text x="612.53" y="308.381" fill="#000" font-size="17" textLength="263.351" font-family="Microsoft YaHei">谁来停？慢 Agent 自己的执行器。</text><text x="612.53" y="330.818" fill="#000" font-size="17" textLength="323" font-family="Microsoft YaHei">正在生成：取消当前生成，从安全点继续。</text><text x="612.53" y="353.255" fill="#000" font-size="17" textLength="323" font-family="Microsoft YaHei">工具已经开始：先等工具完成，保留结果。</text><rect x="328.53" y="291.612" width="258" height="64.874" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="338.53" y="319.6" fill="#000" font-size="17" textLength="168.697" font-family="Microsoft YaHei">④B 安全停下当前工作</text><text x="338.53" y="342.037" fill="#000" font-size="17" textLength="238" font-family="Microsoft YaHei">加入新消息，保留已完成的结果</text><polygon points="297.015,368.704,309.015,380.704,297.015,392.704,285.015,380.704,297.015,368.704" fill="#FFF1CC" style="stroke:#6A8BAB;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="214.84" y="412.704" width="164.351" height="64.874" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="224.84" y="440.692" fill="#000" font-size="17" textLength="144.351" font-family="Microsoft YaHei">⑤ 同一个慢 Agent</text><text x="224.84" y="463.129" fill="#000" font-size="17" textLength="136" font-family="Microsoft YaHei">按新消息继续任务</text><ellipse cx="297.015" cy="508.578" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="297.015" cy="508.578" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="297.015" y1="74.478" x2="297.015" y2="94.478" style="stroke:#52647A;stroke-width:1;"/><polygon points="293.015,84.478,297.015,94.478,301.015,84.478,297.015,88.478" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="297.015" y1="159.352" x2="297.015" y2="179.352" style="stroke:#52647A;stroke-width:1;"/><polygon points="293.015,169.352,297.015,179.352,301.015,169.352,297.015,173.352" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="146.5" y1="263.393" x2="136.5" y2="263.393" style="stroke:#52647A;stroke-width:1;"/><line x1="136.5" y1="263.393" x2="136.5" y2="285.393" style="stroke:#52647A;stroke-width:1;"/><polygon points="132.5,275.393,136.5,285.393,140.5,275.393,136.5,279.393" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="447.53" y1="263.393" x2="457.53" y2="263.393" style="stroke:#52647A;stroke-width:1;"/><line x1="457.53" y1="263.393" x2="457.53" y2="291.612" style="stroke:#52647A;stroke-width:1;"/><polygon points="453.53,281.612,457.53,291.612,461.53,281.612,457.53,285.612" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="136.5" y1="350.267" x2="136.5" y2="380.704" style="stroke:#52647A;stroke-width:1;"/><line x1="136.5" y1="380.704" x2="285.015" y2="380.704" style="stroke:#52647A;stroke-width:1;"/><polygon points="275.015,376.704,285.015,380.704,275.015,384.704,279.015,380.704" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="457.53" y1="356.486" x2="457.53" y2="380.704" style="stroke:#52647A;stroke-width:1;"/><line x1="457.53" y1="380.704" x2="309.015" y2="380.704" style="stroke:#52647A;stroke-width:1;"/><polygon points="319.015,376.704,309.015,380.704,319.015,384.704,315.015,380.704" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="297.015" y1="221.789" x2="297.015" y2="251.393" style="stroke:#52647A;stroke-width:1;"/><polygon points="293.015,241.393,297.015,251.393,301.015,241.393,297.015,245.393" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="297.015" y1="392.704" x2="297.015" y2="412.704" style="stroke:#52647A;stroke-width:1;"/><polygon points="293.015,402.704,297.015,412.704,301.015,402.704,297.015,406.704" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="297.015" y1="477.578" x2="297.015" y2="497.578" style="stroke:#52647A;stroke-width:1;"/><polygon points="293.015,487.578,297.015,497.578,301.015,487.578,297.015,491.578" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="33"><rect x="262.765" y="540.578" width="444" height="83.91" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="267.765" y="560.392" fill="#000" font-size="14" textLength="359.188" font-weight="700" font-family="Microsoft YaHei">快模型只判断；慢 Agent 的执行器负责真正停下和继续。</text><text x="267.765" y="578.869" fill="#000" font-size="14" textLength="252" font-family="Microsoft YaHei">判断超时或失败，走左边“追加”分支。</text><text x="267.765" y="597.347" fill="#000" font-size="14" textLength="384.877" font-family="Microsoft YaHei">图中只展开一次消息处理；慢 Agent 继续后仍可接收新消息。</text><text x="267.765" y="615.824" fill="#000" font-size="14" textLength="434" font-family="Microsoft YaHei">去重、版本检查、已读确认等保护细节由代码处理，不展开成主流程。</text></g><?plantuml-src RLH1KzfG4BxdLxoPNgodscdLgIUmPNffBprrnaig0JDYueIqdVO4jcX04AoejKKH0QLM51mLRB3-5ys-5q_-XMvuYC7AARpT_VRRRx_tT5aFISHgHkXwWQxKw8b1emVinrSeVMMPMNeSPPLv8JmfAzEY9auHlnGGtuTqdwhehyKfYRoInpKrh0PqybPyASdtPxwHFqjaOCWL34-8VlMZh0H9G0o59LVadJW-6TJKzuf_L0sf6ddWQ_zS6HvDKpzsWayV3puPyhY2uhWkVv3rJzwxC2y6V8zwOBgPgkQNj4xMe6VOw_7Ua_LS5gTKnU-zXzt0wAYhG55rwV-ifxv1t_3TB7TZx_2eWoE4TL7JXMSNYvk4nhQ89oWfEg7L8kGgS7f8ZymnXLPBTFM4Pa_0gDtPsuXJMI1qeMoTfVdHTIjf_IanSmtEVzDA0JRcmIZHbUg8u70WcXoSq0NIqyo1P-OECwlGGA0SXY5jqFKoHuHQ7JA6VTp0awkv53RdY8Aa-Dk32NA0z5qiRf4khwjSnDwENltQive9cZs5z7SuMu9uYkD3PlMwbNz8z0b98NrMCyNJ7s9V7AVe8JoPLijNkoLER4onclFEy7i5FfHT-yAo5GSoiGcniaiH2Vr5-deXlGJsun2hG3I7E6ukOyeT04U_ytMsl0QDGzXFKYE3buEPItGZDu9eFI8IOjUYg0h2ua2tajfpkz2eOnsDxzY59AnLBYCpxNo-MPRD8-vrwmUaLx0hvtDpcBJC1SwMpPpowM-gaJB46aYCcMbeHM1dti686QmQxuJQXBiZSDgykhii_903ZczA1399rDHgxdQfezkIyTjdeTtTCar854RGgkgq88Iae0FrJjLrTGfn-_jlZPRUvSwuRlsy5SCjWtsKju-AB9TtTE2x-9RipjZVxpYlZM2Vn1pF6ojGgjj7PPp8Fgv1Ozl-UteHoTddPxYrYyWw6BCqUy07X9z_hMRLuL1VHd4wPk4ERhzjlQoutpCBbfc2z07U8BnWtS4xY0ic-lqo4cLnW-RsQ352ysNyYmkm3qnMsBVtIoWzQaqJwDDPEp73idNBBBBDw4rB53Z52U5YhAR97rW77rNaMlu3?></g></svg>