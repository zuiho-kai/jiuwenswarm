<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:967px;height:947px;background:#FFFFFF;" width="967px" height="947px" viewBox="0 0 967 947" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="330.93" y="34.813" fill="#000" font-size="14" textLength="303.188" font-weight="700" font-family="Microsoft YaHei">全双工架构：慢 Agent 工作时，新消息怎么进来</text></g><ellipse cx="302.012" cy="64.478" rx="10" ry="10" fill="#52647A" style="stroke:#222;stroke-width:1;"/><path d="M429.687,99.478 L429.687,111.696 L409.687,115.696 L429.687,119.696 L429.687,131.915 A0,0 0 0 0 429.687,131.915 L692.481,131.915 A0,0 0 0 0 692.481,131.915 L692.481,109.478 L682.481,99.478 L429.687,99.478 A0,0 0 0 0 429.687,99.478" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><path d="M682.481,99.478 L682.481,109.478 L692.481,109.478 L682.481,99.478" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><text x="435.687" y="122.465" fill="#000" font-size="17" textLength="241.793" font-family="Microsoft YaHei">例如：正在写使用 Kafka 的代码</text><rect x="194.337" y="94.478" width="215.351" height="42.437" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="204.337" y="122.465" fill="#000" font-size="17" textLength="195.351" font-family="Microsoft YaHei">原慢 Agent 正在执行任务</text><path d="M385.527,150.696 L385.527,174.133 L365.527,178.133 L385.527,182.133 L385.527,205.57 A0,0 0 0 0 385.527,205.57 L726.132,205.57 A0,0 0 0 0 726.132,205.57 L726.132,160.696 L716.132,150.696 L385.527,150.696 A0,0 0 0 0 385.527,150.696" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><path d="M716.132,150.696 L716.132,160.696 L726.132,160.696 L716.132,150.696" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><text x="391.527" y="173.684" fill="#000" font-size="17" textLength="319.605" font-family="Microsoft YaHei">例如：“别用 Kafka，改用 PostgreSQL”</text><text x="391.527" y="196.121" fill="#000" font-size="17" textLength="173.32" font-family="Microsoft YaHei">来自用户或其他 Agent</text><rect x="238.497" y="156.915" width="127.03" height="42.437" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="248.497" y="184.902" fill="#000" font-size="17" textLength="107.03" font-family="Microsoft YaHei">① 新消息到达</text><rect x="16" y="215.57" width="931.047" height="365.664" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M264,215.57 L264,231.007 L254,241.007 L16,241.007" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="19" y="234.558" fill="#000" font-size="17" textLength="238" font-family="Microsoft YaHei">新增：接消息、判断是否要打断</text><path d="M419.527,254.789 L419.527,278.226 L399.527,282.226 L419.527,286.226 L419.527,309.663 A0,0 0 0 0 419.527,309.663 L712.527,309.663 A0,0 0 0 0 712.527,309.663 L712.527,264.789 L702.527,254.789 L419.527,254.789 A0,0 0 0 0 419.527,254.789" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><path d="M702.527,254.789 L702.527,264.789 L712.527,264.789 L702.527,254.789" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><text x="425.527" y="277.776" fill="#000" font-size="17" textLength="178.351" font-family="Microsoft YaHei">慢 Agent 此时继续工作</text><text x="425.527" y="300.213" fill="#000" font-size="17" textLength="272" font-family="Microsoft YaHei">判断期间又来消息：合起来重新判断</text><rect x="204.497" y="261.007" width="195.03" height="42.437" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="214.497" y="288.995" fill="#000" font-size="17" textLength="175.03" font-family="Microsoft YaHei">② 输入控制器接住消息</text><rect x="177.337" y="329.663" width="249.351" height="64.874" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="187.337" y="357.65" fill="#000" font-size="17" textLength="141.03" font-family="Microsoft YaHei">③ 快模型看新消息</text><text x="187.337" y="380.087" fill="#000" font-size="17" textLength="229.351" font-family="Microsoft YaHei">和慢 Agent 已提交的工作状态</text><polygon points="234.012,417.923,370.012,417.923,382.012,429.923,370.012,441.923,234.012,441.923,222.012,429.923,234.012,417.923" fill="#FFF1CC" style="stroke:#BD963C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="234.012" y="436.692" fill="#000" font-size="17" textLength="136" font-family="Microsoft YaHei">需要现在打断吗？</text><text x="154.012" y="425.474" fill="#000" font-size="17" textLength="68" font-family="Microsoft YaHei">否：追加</text><text x="382.012" y="425.474" fill="#000" font-size="17" textLength="68" font-family="Microsoft YaHei">是：打断</text><rect x="28" y="451.923" width="258" height="64.874" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="38" y="479.911" fill="#000" font-size="17" textLength="169.992" font-family="Microsoft YaHei">④A 当前步骤继续执行</text><text x="38" y="502.348" fill="#000" font-size="17" textLength="238" font-family="Microsoft YaHei">在下一次模型调用前加入新消息</text><path d="M608.047,468.141 L608.047,491.578 L588.047,495.578 L608.047,499.578 L608.047,523.015 A0,0 0 0 0 608.047,523.015 L935.047,523.015 A0,0 0 0 0 935.047,523.015 L935.047,478.141 L925.047,468.141 L608.047,468.141 A0,0 0 0 0 608.047,468.141" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><path d="M925.047,468.141 L925.047,478.141 L935.047,478.141 L925.047,468.141" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><text x="614.047" y="491.129" fill="#000" font-size="17" textLength="306" font-family="Microsoft YaHei">正在生成：取消当前生成，从安全点继续</text><text x="614.047" y="513.566" fill="#000" font-size="17" textLength="289" font-family="Microsoft YaHei">工具已开始：先等工具完成，保留结果</text><rect x="306" y="451.923" width="282.047" height="87.311" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="316" y="479.911" fill="#000" font-size="17" textLength="262.047" font-family="Microsoft YaHei">④B 由慢 Agent 的执行器安全停下</text><text x="316" y="502.348" fill="#000" font-size="17" textLength="102" font-family="Microsoft YaHei">并加入新消息</text><text x="316" y="524.785" fill="#000" font-size="17" textLength="136" font-family="Microsoft YaHei">保留已完成的工作</text><polygon points="302.012,545.234,314.012,557.234,302.012,569.234,290.012,557.234,302.012,545.234" fill="#FFF1CC" style="stroke:#BD963C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M408.512,617.452 L408.512,629.671 L388.512,633.671 L408.512,637.671 L408.512,649.889 A0,0 0 0 0 408.512,649.889 L665.354,649.889 A0,0 0 0 0 665.354,649.889 L665.354,627.452 L655.354,617.452 L408.512,617.452 A0,0 0 0 0 408.512,617.452" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><path d="M655.354,617.452 L655.354,627.452 L665.354,627.452 L655.354,617.452" style="stroke:#B8C1CC;stroke-width:0.5;" fill="#F5F6F8"/><text x="414.512" y="640.44" fill="#000" font-size="17" textLength="235.842" font-family="Microsoft YaHei">例如：接下来改用 PostgreSQL</text><rect x="215.512" y="601.234" width="173" height="64.874" fill="#E1F0FF" style="stroke:#6A8BAB;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="225.512" y="629.222" fill="#000" font-size="17" textLength="144.351" font-family="Microsoft YaHei">⑤ 同一个慢 Agent</text><text x="225.512" y="651.659" fill="#000" font-size="17" textLength="153" font-family="Microsoft YaHei">带着新消息继续任务</text><ellipse cx="302.012" cy="697.108" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="302.012" cy="697.108" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="302.012" y1="74.478" x2="302.012" y2="94.478" style="stroke:#52647A;stroke-width:1;"/><polygon points="298.012,84.478,302.012,94.478,306.012,84.478,302.012,88.478" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="302.012" y1="136.915" x2="302.012" y2="156.915" style="stroke:#52647A;stroke-width:1;"/><polygon points="298.012,146.915,302.012,156.915,306.012,146.915,302.012,150.915" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="302.012" y1="303.444" x2="302.012" y2="329.663" style="stroke:#52647A;stroke-width:1;"/><polygon points="298.012,319.663,302.012,329.663,306.012,319.663,302.012,323.663" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="222.012" y1="429.923" x2="157" y2="429.923" style="stroke:#52647A;stroke-width:1;"/><line x1="157" y1="429.923" x2="157" y2="451.923" style="stroke:#52647A;stroke-width:1;"/><polygon points="153,441.923,157,451.923,161,441.923,157,445.923" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="382.012" y1="429.923" x2="447.024" y2="429.923" style="stroke:#52647A;stroke-width:1;"/><line x1="447.024" y1="429.923" x2="447.024" y2="451.923" style="stroke:#52647A;stroke-width:1;"/><polygon points="443.024,441.923,447.024,451.923,451.024,441.923,447.024,445.923" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="157" y1="516.797" x2="157" y2="557.234" style="stroke:#52647A;stroke-width:1;"/><line x1="157" y1="557.234" x2="290.012" y2="557.234" style="stroke:#52647A;stroke-width:1;"/><polygon points="280.012,553.234,290.012,557.234,280.012,561.234,284.012,557.234" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="447.024" y1="539.234" x2="447.024" y2="557.234" style="stroke:#52647A;stroke-width:1;"/><line x1="447.024" y1="557.234" x2="314.012" y2="557.234" style="stroke:#52647A;stroke-width:1;"/><polygon points="324.012,553.234,314.012,557.234,324.012,561.234,320.012,557.234" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="302.012" y1="394.537" x2="302.012" y2="417.923" style="stroke:#52647A;stroke-width:1;"/><polygon points="298.012,407.923,302.012,417.923,306.012,407.923,302.012,411.923" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="302.012" y1="199.352" x2="302.012" y2="261.007" style="stroke:#52647A;stroke-width:1;"/><polygon points="298.012,251.007,302.012,261.007,306.012,251.007,302.012,255.007" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="302.012" y1="569.234" x2="302.012" y2="601.234" style="stroke:#52647A;stroke-width:1;"/><polygon points="298.012,591.234,302.012,601.234,306.012,591.234,302.012,595.234" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="302.012" y1="666.108" x2="302.012" y2="686.108" style="stroke:#52647A;stroke-width:1;"/><polygon points="298.012,676.108,302.012,686.108,306.012,676.108,302.012,680.108" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="51"><rect x="278.085" y="729.108" width="408.877" height="194.775" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="283.085" y="748.921" fill="#000" font-size="14" textLength="210" font-weight="700" font-family="Microsoft YaHei">这次架构改动，就看中间这一块：</text><text x="283.085" y="767.399" fill="#000" font-size="14" textLength="384.877" font-family="Microsoft YaHei">新增输入控制器和快模型判断；慢 Agent 仍是原来的执行者。</text><text x="283.085" y="785.876" fill="#000" font-size="14" textLength="317.591" font-family="Microsoft YaHei">快模型超时或判断失败，投递失败；DB 保持未读。</text><text x="283.085" y="804.354" fill="#000" font-size="14" font-family="Microsoft YaHei"> </text><text x="283.085" y="822.832" fill="#000" font-size="14" textLength="196" font-weight="700" font-family="Microsoft YaHei">配套机制（不展开成主流程）：</text><text x="283.085" y="841.309" fill="#000" font-size="14" textLength="316.449" font-family="Microsoft YaHei">消息存储 / 投递 / 已读确认：沿用原 SDK 消息链。</text><text x="283.085" y="859.787" fill="#000" font-size="14" textLength="378" font-family="Microsoft YaHei">工作状态发布：供快模型参考；未明确发布的假设仍是未知。</text><text x="283.085" y="878.264" fill="#000" font-size="14" textLength="378" font-family="Microsoft YaHei">工具账本：记录执行结果，辅助恢复，不能撤销外部副作用。</text><text x="283.085" y="896.742" fill="#000" font-size="14" font-family="Microsoft YaHei"> </text><text x="283.085" y="915.219" fill="#000" font-size="14" textLength="398.877" font-family="Microsoft YaHei">本图只展示一次新消息的处理；⑤后 Agent 仍可继续接收消息。</text></g><?plantuml-src XLLDKzjM5DtxLxn9DuHDIziG6bOsXEbCsauwh3gJZO9bem6aZAqqqtOw8niSv6y7ZFcI0OCChXCRao76uA__GlIUv1L_eVT9GZOkRLbPxzrxxZdtdliGEN6HHJXImka4lYYIlJhPMxbfxP388NBxMLv4SAgr5R9PlsabIAv6wZ89dH8ffLtAHdUNv8kku0B7ls82p1BoiZxczQ8u8_3YJymIYtxavW92KF29w1VcUvQxFtAM-vr5Ouy7BeFpZ5Tum_5-v6CMW-p0pKjcRi4V45xptYbXKGYWBsRClu48To0WlB4l7tqz_krZzy0bCoToltBYRvvXcATZCr_TWN4YXO2N3TXHu-u9ZzjpJzGqnom9lDTp3xkngQd_I1X4zqn_D_xDO30lYEm_8H_DZCzC34VTmPcOkhye-iE5qAp81CIx_K7egGDl7_tfSWLfeEi9JkttlK0gHrWfaUY9KKXepIQE5IPTj3uASFvv4O2qJXmVXwb_p4ZyTbjhT_Li2JrZV0iCqdTMjEQHVX1oiRpNPEvwSltk03c-mdBDw7J-3VHQKh3yte6ZXinUqi_dGb3q1zZPdt-ublAG0QuqLijmG-GB8kTmfAurSvQ6VcLeZiY9dC2Z1r0V7-vHsgcYHUIp5CAoId8LidMACyV6SOX4r-7pWTb485r0HcSTHueaTOBbEjukGQhMJblPan1pHm9G6cYY2jkaDq_qPiLQBZF0BgVizpRFSLe62HOMiC8PsVXq0IUzrIIbQaP2aYF5P7I8SFSzAHNmNbnNuavBN_1uBJ6upXz9EgDTgJ0BgxeUgnCfH2bpFZJIKoGGgwTgvg2fP9pPl6djFqJYFCkZ4MW6C3AwRHmxU6WIXz97ReJRwpYQ99LYhwnQsYoRG7cbf3NYMaCY7meMFQEs3BE1SC2WBRobIZcmiF1e1BfEfs7MxrVn83rxrfS22gmQq7rSZT97BAH0AIXvMH-2Vi5htRo-iGtoSJL1v8mZVzA47veMigskP_SXbeuWdGCWI-Jj8Qn0ogghXoyjpNOo8EF81QtLal19dEP7PBqIjSzD0ZJVfAGtrycUvO61WS9FpWTx2BfLX3C9w9_MA3lYGMFZMCzBZa2h_lyi9LYq4QVE6bwR_bO4HU6LoxN8-kd9Iq4KXIM061qrkjjqVkR_1qZ7iH88mBKpi9hMg81d8G0uuZoOPMTqb2wXkLH3Mm9UT5ng-VYcjTiVgTPCqeM3DoTVTCPhI97FKXWGdKoZ7e4LefjjGc3rp3WlqkSWjj6Jrcu_TwSz25fC4Y6Yb8tJ9WKnjVGYILpS9CeLSBffoLeZYSysO5Gm5QtH99z2UWbc5dM4M4zJPGk7I-XBP1M17p1VGDKBLQEgqkv-f2yTS4Upqy_ifDvwnwO-i6eu_GutbY53w-pscv4E6z8oROPI9bifGBN2g4z3g