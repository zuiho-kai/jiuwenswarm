"154.359" font-family="Microsoft YaHei">同 ID 正在等待处理？</text><text x="346.164" y="392.485" fill="#000" font-size="16" font-family="Microsoft YaHei">否</text><polygon points="161.883,585.271,352.086,585.271,364.086,597.271,352.086,609.271,161.883,609.271,149.883,597.271,161.883,585.271" fill="#FFF1CC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="161.883" y="603.642" fill="#000" font-size="16" textLength="190.203" font-family="Microsoft YaHei">②.3 等待队列已满 32 条？</text><text x="133.883" y="593.083" fill="#000" font-size="16" font-family="Microsoft YaHei">是</text><text x="364.086" y="593.083" fill="#000" font-size="16" font-family="Microsoft YaHei">否</text><rect x="33.883" y="619.271" width="212" height="62.234" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="43.883" y="646.2" fill="#000" font-size="16" textLength="192" font-family="Microsoft YaHei">暂不接收，返回可重试错误</text><text x="43.883" y="667.317" fill="#000" font-size="16" textLength="122.961" font-family="Microsoft YaHei">DB 消息保持未读</text><ellipse cx="139.883" cy="712.505" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="139.883" cy="712.505" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="292.086" y="619.271" width="164" height="41.117" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="302.086" y="646.2" fill="#000" font-size="16" textLength="144" font-family="Microsoft YaHei">记录消息与到达时间</text><polygon points="128,745.31,385.969,745.31,397.969,757.31,385.969,769.31,128,769.31,116,757.31,128,745.31" fill="#FFF1CC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="128" y="763.681" fill="#000" font-size="16" textLength="257.969" font-family="Microsoft YaHei">②.4 上一批已开始交给执行器应用？</text><text x="100" y="753.122" fill="#000" font-size="16" font-family="Microsoft YaHei">是</text><text x="397.969" y="753.122" fill="#000