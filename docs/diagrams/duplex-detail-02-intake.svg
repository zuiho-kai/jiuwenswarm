<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:544px;height:836px;background:#FFFFFF;" width="544px" height="836px" viewBox="0 0 544 836" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="173.809" y="34.813" fill="#000" font-size="14" textLength="194.51" font-weight="700" font-family="Microsoft YaHei">② 接住消息：展开总览第 ② 步</text></g><ellipse cx="268.419" cy="64.478" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="148.786" y="94.478" width="239.266" height="62.234" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="158.786" y="121.407" fill="#000" font-size="16" textLength="155.016" font-family="Microsoft YaHei">②.1 原 SDK 接收消息</text><text x="158.786" y="142.524" fill="#000" font-size="16" textLength="219.266" font-family="Microsoft YaHei">DB 事件 / 轮询，或原用户入口</text><rect x="138.419" y="176.712" width="260" height="62.234" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="148.419" y="203.642" fill="#000" font-size="16" textLength="177.969" font-family="Microsoft YaHei">②.2 原处理器按顺序投递</text><text x="148.419" y="224.759" fill="#000" font-size="16" textLength="240" font-family="Microsoft YaHei">控制、审批、模板消息仍走原逻辑</text><rect x="172.938" y="313.31" width="190.961" height="62.234" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="182.938" y="340.239" fill="#000" font-size="16" textLength="80" font-family="Microsoft YaHei">不重复投递</text><text x="182.938" y="361.356" fill="#000" font-size="16" textLength="170.961" font-family="Microsoft YaHei">DB 输入重试原已读确认</text><ellipse cx="268.419" cy="406.544" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="268.419" cy="406.544" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="161.606,260.751,375.231,260.751,387.231,272.751,375.231,284.751,161.606,284.751,149.606,272.751,161.606,260.751" fill="#FFF1CC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="272.419" y="301.681" fill="#000" font-size="16" font-family="Microsoft YaHei">是</text><text x="161.606" y="279.122" fill="#000" font-size="16" textLength="213.625" font-family="Microsoft YaHei">当前实例已经应用过这个 ID？</text><text x="387.231" y="268.563" fill="#000" font-size="16" font-family="Microsoft YaHei">否</text><rect x="158.622" y="459.544" width="219.594" height="62.234" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="168.622" y="486.474" fill="#000" font-size="16" textLength="199.594" font-family="Microsoft YaHei">②.3 持久保存完整消息和 ID</text><text x="168.622" y="507.591" fill="#000" font-size="16" textLength="160" font-family="Microsoft YaHei">写入失败则不确认接收</text><rect x="125.896" y="541.778" width="285.047" height="62.234" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="135.896" y="568.708" fill="#000" font-size="16" textLength="193.969" font-family="Microsoft YaHei">②.4 交给判断层后立即返回</text><text x="135.896" y="589.825" fill="#000" font-size="16" textLength="265.047" font-family="Microsoft YaHei">原 SDK 确认已读，继续接收后续事件</text><rect x="181.685" y="624.013" width="173.469" height="41.117" fill="#E1F0FF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="191.685" y="650.942" fill="#000" font-size="16" textLength="153.469" font-family="Microsoft YaHei">异步进入第 ③ 步判断</text><ellipse cx="268.419" cy="696.13" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="268.419" cy="696.13" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="268.419" y1="74.478" x2="268.419" y2="94.478" style="stroke:#181818;stroke-width:1;"/><polygon points="264.419,84.478,268.419,94.478,272.419,84.478