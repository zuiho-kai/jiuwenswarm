name: win-duplex-check
on:
  push:
    branches: [ci/win-duplex-check]
jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: install electron
        working-directory: jiuwenswarm/channels/desktop/electron
        run: |
          npm ci --no-audit --no-fund
          if (-not (Test-Path node_modules\electron\dist\electron.exe)) { node node_modules\electron\install.js }
        shell: pwsh
      - name: run e2e
        shell: pwsh
        run: |
          $env:PICKER = "$PWD\jiuwenswarm\channels\desktop\electron\display_media_picker.cjs"
          $env:OUT_DIR = "$PWD\e2e-out"; New-Item -ItemType Directory -Force $env:OUT_DIR | Out-Null
          Copy-Item ci\win_display_media_e2e.cjs $env:OUT_DIR\
          $electron = "$PWD\jiuwenswarm\channels\desktop\electron\node_modules\electron\dist\electron.exe"
          & $electron --version
          & $electron "$env:OUT_DIR\win_display_media_e2e.cjs" 2>&1 | Tee-Object e2e-out\log.txt
          if (-not (Select-String -Path e2e-out\log.txt -Pattern 'E2E_PASS' -Quiet)) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-out, path: e2e-out }
  inspect-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install 0.2.8.beta1 release exe and list
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download v0.2.8.beta1 -R openJiuwen-ai/jiuwenswarm -p '*windows.exe' -D rel
          $exe = Get-ChildItem rel\*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\ws' -Wait
          Get-ChildItem C:\ws | Select Name, Length
          Write-Host "electron main.cjs present: $(Test-Path C:\ws\resources\app\main.cjs)"
          Write-Host "pywebview present: $((Get-ChildItem C:\ws -Recurse -Directory -Filter webview -ErrorAction SilentlyContinue | Select -First 1).FullName)"
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: probe WebView2 media permissions via pywebview (real mic absent; fake device, real permission UI)
        shell: pwsh
        run: |
          pip install pywebview==6.2.1 pythonnet | Out-Null
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--use-fake-device-for-media-stream'
          python ci\webview2_probe.py
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: astral-sh/setup-uv@v5
      - name: build electron exe
        shell: pwsh
        run: .\scripts\build-electron-exe.ps1 -NoSign -Test
      - name: verify packaged picker and launch
        shell: pwsh
        run: |
          $app = Get-ChildItem dist -Directory | Where-Object Name -like '*-Electron' | Select-Object -First 1
          Write-Host "app dir: $($app.FullName)"
          Get-ChildItem "$($app.FullName)\resources\app" -Filter *.cjs | Select Name
          if (-not (Test-Path "$($app.FullName)\resources\app\display_media_picker.cjs")) { throw 'picker missing in package' }
          $exe = Get-ChildItem $app.FullName -Filter *.exe | Select-Object -First 1
          $log = "$PWD\launch-log.txt"
          $p = Start-Process $exe.FullName -PassThru -RedirectStandardOutput $log -RedirectStandardError "$PWD\launch-err.txt"
          Start-Sleep 120
          $alive = -not $p.HasExited
          Get-Content $log, "$PWD\launch-err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 80
          if (Select-String -Path $log, "$PWD\launch-err.txt" -Pattern 'Cannot find module|display_media_picker' -Quiet) { Write-Host 'MODULE PROBLEM'; Select-String -Path $log, "$PWD\launch-err.txt" -Pattern 'Cannot find module' }
          Write-Host "alive after 120s: $alive"
          Get-ChildItem dist -Recurse -Filter *.exe -Depth 1 | Select FullName, Length
          if (-not $alive) { throw 'packaged app exited' }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workswarm-electron-installer
          path: |
            dist/*.exe
            launch-log.txt
            launch-err.txt
          if-no-files-found: warn
