name: win-duplex-check
on:
  push:
    branches: [ci/win-duplex-check]
jobs:
  frozen-duplex:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: workswarm-electron-installer
          run-id: 38848465867
          github-token: ${{ github.token }}
          path: inst
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: install, start frozen backend, click full-duplex
        shell: pwsh
        run: |
          Get-ChildItem inst -Recurse -Filter *.exe | Select FullName, Length
          $setup = Get-ChildItem inst -Recurse -Filter *.exe | Sort-Object Length -Descending | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\ws' -Wait
          Start-Sleep 5
          Get-Process | Where-Object { $_.Path -like 'C:\ws\*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          $be = Get-ChildItem C:\ws\resources\backend -Filter workswarm*.exe | Select-Object -First 1
          Write-Host "backend: $($be.FullName)"
          & $be.FullName init | Select-Object -Last 3
          $cfg = "$env:USERPROFILE\.jiuwenswarm\config\config.yaml"
          (Get-Content $cfg) -replace 'task_full_duplex_enabled: false','task_full_duplex_enabled: true' | Set-Content $cfg -Encoding utf8
          Add-Content "$env:USERPROFILE\.jiuwenswarm\config\.env" "`nQWEN_OMNI_REALTIME_URL=`"wss://dashscope.aliyuncs.com/api-ws/v1/realtime`"`nQWEN_OMNI_API_KEY=`"sk-invalid-for-test`"`nQWEN_OMNI_MODEL_NAME=`"qwen3-omni-flash-realtime`"`n"
          $env:JIUWENSWARM_DESKTOP='1'; $env:JIUWENSWARM_ELECTRON='1'; $env:JIUWENSWARM_RUNTIME_WORKSPACE_READY='1'
          $env:WEB_HOST='127.0.0.1'; $env:WEB_PORT='29000'; $env:GATEWAY_PORT='29001'; $env:AGENT_SERVER_PORT='28092'; $env:AGENT_PORT='28092'; $env:FRONTEND_PORT='25173'
          New-Item -ItemType Directory -Force frozen-out | Out-Null
          Start-Process $be.FullName -ArgumentList '--desktop-run-agent' -RedirectStandardOutput frozen-out\agent.log -RedirectStandardError frozen-out\agent.err
          Start-Process $be.FullName -ArgumentList '--desktop-run-gateway' -RedirectStandardOutput frozen-out\gateway.log -RedirectStandardError frozen-out\gateway.err
          Start-Process $be.FullName -ArgumentList '--desktop-run-web','--host','127.0.0.1','--port','25173','--proxy-target','http://127.0.0.1:29000' -RedirectStandardOutput frozen-out\web.log -RedirectStandardError frozen-out\web.err
          for ($i=0; $i -lt 60; $i++) { try { Invoke-WebRequest http://127.0.0.1:25173/ -UseBasicParsing -TimeoutSec 3 | Out-Null; break } catch { Start-Sleep 3 } }
          Start-Sleep 20
          pip install playwright | Out-Null
          python ci\drive_win.py http://127.0.0.1:25173/
          Select-String -Path "$env:USERPROFILE\.jiuwenswarm\agent\.logs\*.log", frozen-out\*.log, frozen-out\*.err -Pattern 'qwen|video\.|duplex|Traceback|ERROR' -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { $_.Line.Substring(0, [Math]::Min(300, $_.Line.Length)) }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: frozen-out, path: frozen-out }
