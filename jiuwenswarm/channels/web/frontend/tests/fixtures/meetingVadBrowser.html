<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Meeting VAD browser smoke test</title></head>
  <body>
    <h1>Meeting VAD browser smoke test</h1>
    <p>Uses actual Silero inference with synthetic audio. No microphone, ASR, or external TTS calls.</p>
    <button id="silence">Run silence test</button>
    <button id="speech">Run speech-end test</button>
    <pre id="result" role="status" style="white-space: pre-wrap">Ready</pre>
    <script type="module">
      import { MeetingVad } from '../../../../../extensions/meeting/frontend/meetingVad.ts';
      const buttons = [...document.querySelectorAll('button')];
      const result = document.querySelector('#result');
      for (const button of buttons) button.addEventListener('click', () => run(button.id));
      async function run(mode) {
        buttons.forEach(button => button.disabled = true);
        result.textContent = 'Loading actual Silero model and starting audio worklet…';
        const context = new AudioContext({sampleRate: 48000});
        const destination = context.createMediaStreamDestination();
        const silence = context.createConstantSource();
        silence.offset.value = 0;
        silence.connect(destination);
        silence.start();
        await context.resume();
        let frames = 0, maxProbability = 0, heard = false, finished = false, vad, speech;
        const timeout = setTimeout(() => finish('Timed out before detection completed'), 20000);
        async function finish(error) {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          vad?.stop();
          silence.stop();
          silence.disconnect();
          try { speech?.stop(); } catch {}
          speech?.disconnect();
          destination.stream.getTracks().forEach(track => track.stop());
          await context.close();
          result.textContent = error ? 'Failed: ' + error :
            'Passed: actual Silero processed ' + frames + ' frames. Maximum speech probability: ' + maxProbability.toFixed(5) +
            (mode === 'speech' ? '. Speech was confirmed and the utterance ended after 640 ms silence.' : '. Silence did not trigger speech.') +
            ' Model, WASM, audio worklet, and cleanup succeeded.';
          buttons.forEach(button => button.disabled = false);
        }
        vad = new MeetingVad(destination.stream, detection => {
          if (finished) return;
          frames++;
          maxProbability = Math.max(maxProbability, detection.probability);
          if (mode === 'silence') {
            if (detection.state !== 'idle') void finish('Silence was classified as speech');
            else if (frames >= 100) void finish();
          } else {
            if (detection.state === 'started') heard = true;
            if (heard && detection.state === 'ended') void finish();
          }
        }, () => { void finish('VAD reported an error'); });
        try {
          if (mode === 'speech') {
            const response = await fetch('../../node_modules/.cache/meeting/vad-test-speech.wav');
            if (!response.ok) throw new Error('Generate node_modules/.cache/meeting/vad-test-speech.wav first (see meeting README)');
            speech = context.createBufferSource();
            speech.buffer = await context.decodeAudioData(await response.arrayBuffer());
            speech.connect(destination);
          }
          await vad.start();
          vad.reset();
          if (!finished) speech?.start();
        } catch (error) { void finish(String(error)); }
      }
    </script>
  </body>
</html>
